name: Vulnerability Check of Latest Release/Tag

on:
  workflow_dispatch:
  schedule:
    - cron: "35 9 * * 1"

permissions:
  contents: read

jobs:
  osv-check:
    runs-on: ubuntu-latest
    if: github.repository == 'mxmehl/seafile-mirror'
    steps:
      - uses: mxmehl/latest-release-vulnerability-status@cbed5babdd804ef28567bcddf51e0a238be73c8b # v1.3.0
